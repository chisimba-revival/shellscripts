<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.chisimba.com
    ServerAlias chisimba.com

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^www\.chisimba\.com$ [NC]
    RewriteRule ^ https://www.chisimba.com%{REQUEST_URI} [R=301,L,NE]

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass        / http://127.0.0.1:8085/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:8085/

    ErrorLog ${APACHE_LOG_DIR}/chisimba.com-error.log
    CustomLog ${APACHE_LOG_DIR}/chisimba.com-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/chisimba.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/chisimba.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
