# Public entry point for the localhost-only Chisimba.com PHP 8.5 service.
# HTTPS is added only after both DNS names resolve to this host.
<VirtualHost *:80>
    ServerName www.chisimba.com
    ServerAlias chisimba.com

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass        / http://127.0.0.1:8085/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:8085/

    ErrorLog ${APACHE_LOG_DIR}/chisimba.com-error.log
    CustomLog ${APACHE_LOG_DIR}/chisimba.com-access.log combined
</VirtualHost>
