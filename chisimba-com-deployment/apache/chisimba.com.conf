# Canonical HTTPS redirect for the localhost-only Chisimba.com service.
<VirtualHost *:80>
    ServerName www.chisimba.com
    ServerAlias chisimba.com

    RewriteEngine On
    RewriteRule ^ https://www.chisimba.com%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/chisimba.com-error.log
    CustomLog ${APACHE_LOG_DIR}/chisimba.com-access.log combined
</VirtualHost>
